<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Corinthians x Rosario Central - Ao Vivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(0.85rem, 3vw, 1.25rem);
      font-weight: 600;
      text-align: center;
      padding: 10px 12px;
    }
    .player {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
    }
    .player iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .ad-banner {
      width: 300px;
      max-width: 100vw;
      height: 250px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    @media (max-height: 560px) {
      .ad-banner { display: none; }
    }
  </style>
</head>
<body>
  <h1>Corinthians x Rosario Central</h1>

  <div class="player">
    <iframe
      src="https://esportesembed.net/corinthians-x-rosario-central-1"
      title="Corinthians x Rosario Central"
      allowfullscreen
      allow="autoplay; encrypted-media; picture-in-picture"
    ></iframe>
  </div>


</body>
</html>
